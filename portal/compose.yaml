name: sdai-portal

services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PORTAL_DB_ROOT_PASSWORD:?Define PORTAL_DB_ROOT_PASSWORD in portal/.env}
      MARIADB_DATABASE: sdai_portal_dev
      MARIADB_USER: portal_user
      MARIADB_PASSWORD: ${PORTAL_DB_PASSWORD:?Define PORTAL_DB_PASSWORD in portal/.env}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - portal_db_data:/var/lib/mysql

volumes:
  portal_db_data:
