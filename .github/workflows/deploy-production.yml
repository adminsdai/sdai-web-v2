name: Build SDAI Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdai-production-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Production Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Validate production build
        run: |
          test -f dist/index.html
          test -d dist/_astro
          test -f dist/contact.php
          test -d dist/scan

          echo "SDAI production build validated"

      - name: Security gate
        run: npm audit --audit-level=critical

      - name: Prepare production branch
        run: |
          rm -rf deploy-output
          mkdir deploy-output

          cp -a dist/. deploy-output/

          echo "=== PRODUCTION ARTIFACT ==="
          find deploy-output -maxdepth 2 -type f | sort | head -100

      - name: Publish production artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd deploy-output

          git init -b production

          git config user.name "SDAI Deployment"
          git config user.email "deploy@sdaichile.com"

          git add -A

          git commit -m "deploy: ${SOURCE_SHA}"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          git push --force origin production