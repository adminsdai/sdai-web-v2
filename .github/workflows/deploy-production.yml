name: Deploy SDAI Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdai-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -d dist/_astro
          test -f dist/contact.php
          test -d dist/scan
          echo "SDAI production artifact validated"

      - name: Security gate - critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdai-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Hostinger
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: sdai-production-build
          path: dist

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test Hostinger SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SDAI SSH CONNECTION OK'"

      - name: Deploy SDAI
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          rsync -azv \
            --exclude=".env" \
            --exclude=".well-known/" \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Deployment completed
        run: |
          echo "====================================="
          echo "SDAI PRODUCTION DEPLOYMENT COMPLETED"
          echo "====================================="
