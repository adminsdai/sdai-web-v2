name: SDAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, Audit and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Security gate - critical
        run: npm audit --audit-level=critical

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/sdai_ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/sdai_ci

      - name: Unified RBAC regression
        run: npm run auth:test:unified

      - name: Legacy RBAC regression
        run: npm run auth:test

      - name: Cost engine regression
        run: npm run cost:test

      - name: GAP translation regression
        run: npm run cost:test:gap

      - name: Build production artifact
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/_astro
          test -f dist/contact.php
          test -d dist/scan
          test -f dist/pyme/index.html
          echo "SDAI CI validation completed successfully"
